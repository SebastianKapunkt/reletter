<!doctype html>
<html lang="en">
<head>
  <title>Reletter</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="lavender">
  <link rel="icon" href="images/reletter-152.png" type="image/png">
  <link rel="apple-touch-icon" href="images/reletter-152.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="lavender">
  <meta name="apple-mobile-web-app-title" content="Reletter">
  <link href="css/main.css" rel="stylesheet">
</head>
<body>
<svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
    <symbol id="icon-next" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="icon-word" viewBox="0 0 24 24"><path d="m4 19 1-5L16 3l5 5L10 19l-6 1m9-14 5 5M14 21h7"/></symbol>
    <symbol id="icon-resume" viewBox="0 0 24 24"><path d="m10 7 7 5-7 5Z"/><circle cx="12" cy="12" r="10"/></symbol>
    <symbol id="icon-done" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="icon-install" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
  </defs>
</svg>
<main id="app">
  <section id="grid-screen" class="screen" aria-label="Letter selection" hidden>
    <div id="letter-grid" class="letter-grid"></div>
    <div class="controls">
      <button id="grid-back" class="action secondary" type="button" aria-label="Back to active drawing"><svg aria-hidden="true"><use href="#icon-back"/></svg></button>
      <button id="new-word" class="action" type="button" aria-label="Start a word"><svg aria-hidden="true"><use href="#icon-word"/></svg></button>
      <button id="install-app" class="action secondary" type="button" aria-label="Install app" hidden><svg aria-hidden="true"><use href="#icon-install"/></svg></button>
      <button id="resume-word" class="action secondary advance" type="button" aria-label="Resume word" hidden><svg aria-hidden="true"><use href="#icon-resume"/></svg></button>
    </div>
  </section>

  <form id="entry-screen" class="screen" aria-label="Enter a word or sentence" hidden>
    <div class="entry-field">
      <input id="word-input" type="text" aria-label="Word or sentence to write" autocomplete="off" spellcheck="false" enterkeyhint="go">
    </div>
    <div class="controls">
      <button id="entry-back" class="action secondary" type="button" aria-label="Back to letter grid"><svg aria-hidden="true"><use href="#icon-back"/></svg></button>
      <button id="start-word" class="action advance" type="submit" aria-label="Start tracing word" disabled><svg aria-hidden="true"><use href="#icon-next"/></svg></button>
    </div>
  </form>

  <section id="draw-screen" class="screen" aria-label="Drawing" hidden>
    <div id="canvas-stage">
      <canvas id="letter-canvas" aria-label="Draw the current letter"></canvas>
      <div id="showcase-art" role="img" hidden></div>
    </div>
    <div class="controls">
      <button id="open-grid" class="action secondary" type="button" aria-label="Letter grid"><svg aria-hidden="true"><use href="#icon-grid"/></svg></button>
      <button id="next-letter" class="action" type="button" aria-label="Next letter" hidden><svg aria-hidden="true"><use id="next-icon" href="#icon-next"/></svg></button>
      <button id="clear-canvas" class="action secondary advance" type="button" aria-label="Clear current drawing"><svg aria-hidden="true"><use href="#icon-trash"/></svg></button>
    </div>
    <div id="word-strip" class="strip word-strip" role="group" aria-label="Letters in your word" hidden></div>
    <div class="drawing-dock">
      <div id="active-slot" aria-label="Current active drawing"></div>
      <div id="history-strip" class="strip history-strip" role="group" aria-label="Drawing history, newest first"></div>
    </div>
  </section>

</main>
<script src="js/letters.js"></script>
<script src="js/letter-renderer.js"></script>
<script src="js/drawing-store.js"></script>
<script src="js/index.js"></script>
</body>
</html>
